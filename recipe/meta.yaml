{% set name = "hydra-core" %}
{% set version = "1.3.7" %}
# Hydra 1.3 is a legacy release; keep Python 3.10 support.
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/facebookresearch/hydra/archive/v{{ version }}.tar.gz
  sha256: c613c83dab7552fa5cfb78d774a0a0d5e2b3f982e1775d0487ff3b66d124d1fc

build:
  noarch: python
  number: 0
  script:
    - {{ PYTHON }} setup.py antlr
    - {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - antlr ==4.9.*
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - omegaconf >=2.2,<2.4
    - antlr-python-runtime ==4.9.*
    - packaging

test:
  imports:
    - hydra
  requires:
    - python {{ python_min }}
    - pip
  commands:
    - pip check

about:
  home: https://hydra.cc/
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A framework for elegantly configuring complex applications
  doc_url: https://hydra.cc/docs/intro/
  dev_url: https://github.com/facebookresearch/hydra

extra:
  recipe-maintainers:
    - omry
    - mdraw
    - benjaminrwilson
