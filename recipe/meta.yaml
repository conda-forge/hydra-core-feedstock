{% set name = "hydra-core" %}
{% set version = "1.4.0rc1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/h/hydra-core/hydra_core-{{ version }}.tar.gz
  sha256: a00aa0b9ba4ce3f012fdda5b600b535c1a40bc8b6c894de4b1c4fb3d5b2fedf8

build:
  noarch: python
  number: 0
  script:
    - {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - openjdk
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - omegaconf >=2.4.0rc1

test:
  imports:
    - hydra
  requires:
    - python {{ python_min }}
    - pip
  commands:
    - pip check

about:
  home: https://hydra.cc/
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - ATTRIBUTION/LICENSE-antlr4
  summary: A framework for elegantly configuring complex applications
  doc_url: https://hydra.cc/docs/intro/
  dev_url: https://github.com/hydra-ecosystem/hydra

extra:
  recipe-maintainers:
    - omry
    - mdraw
    - benjaminrwilson
